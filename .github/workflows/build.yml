name: Build Narcade PSP
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias Python
        run: |
          (apk add --no-cache python3 py3-pip 2>/dev/null || (apt-get update && apt-get install -y python3 python3-pip))
          python3 -m pip install --break-system-packages pycryptodome pycdlib || python3 -m pip install pycryptodome pycdlib
      - name: Compilar (PRX + EBOOT.PBP)
        run: |
          cd 'Narcade (My Own GTA)'
          python3 tools/build_localization.py
          make
          make -f Makefile.iso
          file narcade_static.elf || true
      - name: Firmar y empaquetar ISO
        run: |
          cd 'Narcade (My Own GTA)'
          mkdir -p build
          python3 tools/package_iso.py
          mkdir -p out/PSP/GAME/NARCADE
          cp EBOOT.PBP out/PSP/GAME/NARCADE/
          cp assets/loading-v241/valley.rgb565 out/PSP/GAME/NARCADE/LOAD0.BIN
          for k in 0 1 2; do [ -f assets/title-slides/slide$k.rgb565 ] && cp assets/title-slides/slide$k.rgb565 out/PSP/GAME/NARCADE/TITLE$k.BIN; done
          cp assets/loading-v241/street.rgb565 out/PSP/GAME/NARCADE/LOAD1.BIN
          cp assets/loading-v241/rooftop.rgb565 out/PSP/GAME/NARCADE/LOAD2.BIN
          cp Narcade.iso out/
          sha256sum out/Narcade.iso out/PSP/GAME/NARCADE/EBOOT.PBP out/PSP/GAME/NARCADE/LOAD*.BIN
      - uses: actions/upload-artifact@v4
        with:
          name: narcade-psp
          path: "Narcade (My Own GTA)/out"
